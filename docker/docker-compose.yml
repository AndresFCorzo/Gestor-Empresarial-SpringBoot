services:
  # =====================================================
  # SERVICIO DE BASE DE DATOS MYSQL
  # =====================================================
  mysql:
    image: mysql:8.0
    container_name: gestor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestor_empresarial
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gestor-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      timeout: 20s
      retries: 10
      interval: 10s

  # =====================================================
  # SERVICIO DE LA API SPRING BOOT
  # =====================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.multistage
    container_name: gestor-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: gestor_empresarial
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: gestorEmpresarialSecretKey2025
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    networks:
      - gestor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/auth/verify"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# =====================================================
# VOLÚMENES PERSISTENTES
# =====================================================
volumes:
  mysql_data:
    name: gestor-mysql-data

# =====================================================
# REDES
# =====================================================
networks:
  gestor-network:
    name: gestor-network
    driver: bridge