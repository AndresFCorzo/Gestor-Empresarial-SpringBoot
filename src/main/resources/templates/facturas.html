<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Facturación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">🏢 Facturación</span>
            <div>
                <a href="/dashboard.html" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-house"></i> Inicio</a>
                <button class="btn btn-success btn-sm me-2" data-bs-toggle="modal" data-bs-target="#facturaModal" onclick="cargarDatosFactura()">Nueva Factura</button>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Salir</button>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2><i class="bi bi-receipt"></i> Lista de Facturas</h2>
        <div class="card mt-3">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="facturasTable">
                        <thead class="table-dark">
                            <tr><th>ID</th><th>N° Factura</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="facturasBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal para emitir factura -->
    <div class="modal fade" id="facturaModal" tabindex="-1" style="max-width: 800px;">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Emitir Factura</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <label>Cliente</label>
                            <select class="form-select" id="idCliente" required><option value="">Seleccione...</option></select>
                        </div>
                        <div class="col-md-6">
                            <label>Número Factura</label>
                            <input type="text" class="form-control" id="numeroFactura" required>
                        </div>
                    </div>
                    <hr>
                    <h6>Agregar Productos</h6>
                    <div class="row">
                        <div class="col-md-8"><select class="form-select" id="idProducto"><option value="">Seleccione producto...</option></select></div>
                        <div class="col-md-2"><input type="number" class="form-control" id="cantidad" placeholder="Cant" value="1"></div>
                        <div class="col-md-2"><button class="btn btn-primary" onclick="agregarProducto()"><i class="bi bi-plus"></i></button></div>
                    </div>
                    <hr>
                    <h6>Detalle de Factura</h6>
                    <table class="table table-sm">
                        <thead><tr><th>Producto</th><th>Cant</th><th>Precio</th><th>Total</th><th></th></tr></thead>
                        <tbody id="detalleBody"></tbody>
                        <tfoot><tr class="table-primary"><th colspan="3">SUBTOTAL</th><th id="subtotal">$0</th></tr>
                        <tr class="table-info"><th colspan="3">IVA</th><th id="iva">$0</th></tr>
                        <tr class="table-success"><th colspan="3">TOTAL</th><th id="total">$0</th></tr></tfoot>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="emitirFactura()">Emitir Factura</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let detalles = [];
        
        async function cargarFacturas() {
            const response = await fetch('/api/facturas');
            const facturas = await response.json();
            const tbody = document.getElementById('facturasBody');
            tbody.innerHTML = '';
            facturas.forEach(f => {
                tbody.innerHTML += `<tr><td>${f.idFactura}</td><td>${f.numeroFactura}</td><td>${new Date(f.fecha).toLocaleDateString()}</td><td>${f.cliente?.nombre || 'N/A'}</td>
                <td>$${f.total.toLocaleString()}</td><td><span class="badge ${f.estado === 'EMITIDA' ? 'bg-success' : 'bg-danger'}">${f.estado}</span></td>
                <td><button class="btn btn-sm btn-danger" onclick="anularFactura(${f.idFactura})">Anular</button></td></tr>`;
            });
        }
        
        async function cargarDatosFactura() {
            const [clientesRes, productosRes] = await Promise.all([fetch('/api/clientes'), fetch('/api/productos')]);
            const clientes = await clientesRes.json();
            const productos = await productosRes.json();
            
            const selectCliente = document.getElementById('idCliente');
            selectCliente.innerHTML = '<option value="">Seleccione...</option>';
            clientes.forEach(c => selectCliente.innerHTML += `<option value="${c.idCliente}">${c.nombre} - ${c.nit}</option>`);
            
            const selectProducto = document.getElementById('idProducto');
            selectProducto.innerHTML = '<option value="">Seleccione...</option>';
            productos.forEach(p => selectProducto.innerHTML += `<option value="${p.idProducto}" data-precio="${p.precio}" data-iva="${p.porcentajeIva}">${p.nombre} - $${p.precio} (Stock: ${p.stock})</option>`);
            
            detalles = [];
            actualizarDetalle();
        }
        
        function agregarProducto() {
            const select = document.getElementById('idProducto');
            const option = select.options[select.selectedIndex];
            const idProducto = select.value;
            const nombre = option.text.split(' - ')[0];
            const precio = parseFloat(option.dataset.precio);
            const cantidad = parseInt(document.getElementById('cantidad').value);
            
            if (!idProducto || cantidad < 1) { alert('Seleccione producto y cantidad válida'); return; }
            
            detalles.push({ idProducto, nombre, cantidad, precio, total: precio * cantidad });
            actualizarDetalle();
            document.getElementById('cantidad').value = 1;
            select.selectedIndex = 0;
        }
        
        function actualizarDetalle() {
            const tbody = document.getElementById('detalleBody');
            tbody.innerHTML = '';
            let subtotal = 0;
            detalles.forEach((d, i) => {
                subtotal += d.total;
                tbody.innerHTML += `<tr><td>${d.nombre}</td><td>${d.cantidad}</td><td>$${d.precio}</td><td>$${d.total}</td>
                <td><button class="btn btn-sm btn-danger" onclick="eliminarProducto(${i})"><i class="bi bi-trash"></i></button></td></tr>`;
            });
            const iva = subtotal * 0.19;
            document.getElementById('subtotal').innerText = `$${subtotal.toLocaleString()}`;
            document.getElementById('iva').innerText = `$${iva.toLocaleString()}`;
            document.getElementById('total').innerText = `$${(subtotal + iva).toLocaleString()}`;
        }
        
        function eliminarProducto(index) { detalles.splice(index, 1); actualizarDetalle(); }
        
        async function emitirFactura() {
            const idCliente = document.getElementById('idCliente').value;
            const numeroFactura = document.getElementById('numeroFactura').value;
            
            if (!idCliente || detalles.length === 0) { alert('Complete la factura'); return; }
            
            const factura = { numeroFactura, idCliente: parseInt(idCliente), detalles: detalles.map(d => ({ idProducto: d.idProducto, cantidad: d.cantidad })) };
            const response = await fetch('/api/facturas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(factura) });
            
            if (response.ok) { alert('Factura emitida'); location.reload(); } 
            else alert('Error al emitir');
        }
        
        async function anularFactura(id) { if (confirm('¿Anular?')) { await fetch(`/api/facturas/${id}/anular`, { method: 'PUT' }); cargarFacturas(); } }
        function logout() { localStorage.removeItem('usuario'); window.location.href = '/login.html'; }
        
        if (!localStorage.getItem('usuario')) window.location.href = '/login.html';
        cargarFacturas();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
