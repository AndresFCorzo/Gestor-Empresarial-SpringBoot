<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">🏢 Gestión de Clientes</span>
            <div>
                <a href="/dashboard.html" class="btn btn-outline-light btn-sm me-2">
                    <i class="bi bi-house"></i> Inicio
                </a>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Salir</button>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-people"></i> Lista de Clientes</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#clienteModal" onclick="resetForm()">
                <i class="bi bi-plus-circle"></i> Nuevo Cliente
            </button>
        </div>
        
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="clientesTable">
                        <thead class="table-dark">
                            <tr><th>ID</th><th>Nombre</th><th>NIT</th><th>Dirección</th><th>Teléfono</th><th>Correo</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="clientesBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal para registrar/editar cliente -->
    <div class="modal fade" id="clienteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Registrar Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="clienteForm">
                        <input type="hidden" id="clienteId">
                        <div class="mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">NIT *</label>
                            <input type="text" class="form-control" id="nit" placeholder="Ej: 900123456-1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" class="form-control" id="direccion">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo</label>
                            <input type="email" class="form-control" id="correo">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarCliente()">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = '/api/clientes';
        let editando = false;
        
        async function cargarClientes() {
            const response = await fetch(API_URL);
            const clientes = await response.json();
            const tbody = document.getElementById('clientesBody');
            tbody.innerHTML = '';
            clientes.forEach(c => {
                tbody.innerHTML += `
                    <tr>
                        <td>${c.idCliente}</td>
                        <td>${c.nombre}</td>
                        <td>${c.nit}</td>
                        <td>${c.direccion || '-'}</td>
                        <td>${c.telefono || '-'}</td>
                        <td>${c.correo || '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editarCliente(${c.idCliente})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="eliminarCliente(${c.idCliente})"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }
        
        async function guardarCliente() {
            const cliente = {
                nombre: document.getElementById('nombre').value,
                nit: document.getElementById('nit').value,
                direccion: document.getElementById('direccion').value,
                telefono: document.getElementById('telefono').value,
                correo: document.getElementById('correo').value
            };
            
            const id = document.getElementById('clienteId').value;
            let response;
            
            if (id) {
                response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cliente)
                });
            } else {
                response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cliente)
                });
            }
            
            if (response.ok) {
                alert(id ? 'Cliente actualizado' : 'Cliente registrado');
                bootstrap.Modal.getInstance(document.getElementById('clienteModal')).hide();
                cargarClientes();
                resetForm();
            } else {
                const error = await response.json();
                alert('Error: ' + error.error);
            }
        }
        
        async function editarCliente(id) {
            const response = await fetch(`${API_URL}/${id}`);
            const cliente = await response.json();
            document.getElementById('clienteId').value = cliente.idCliente;
            document.getElementById('nombre').value = cliente.nombre;
            document.getElementById('nit').value = cliente.nit;
            document.getElementById('direccion').value = cliente.direccion || '';
            document.getElementById('telefono').value = cliente.telefono || '';
            document.getElementById('correo').value = cliente.correo || '';
            document.getElementById('modalTitle').innerText = 'Editar Cliente';
            new bootstrap.Modal(document.getElementById('clienteModal')).show();
        }
        
        async function eliminarCliente(id) {
            if (confirm('¿Eliminar este cliente?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    alert('Cliente eliminado');
                    cargarClientes();
                } else {
                    alert('Error al eliminar');
                }
            }
        }
        
        function resetForm() {
            document.getElementById('clienteId').value = '';
            document.getElementById('clienteForm').reset();
            document.getElementById('modalTitle').innerText = 'Registrar Cliente';
        }
        
        function logout() { localStorage.removeItem('usuario'); window.location.href = '/login.html'; }
        
        // Verificar autenticación
        if (!localStorage.getItem('usuario')) window.location.href = '/login.html';
        cargarClientes();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
