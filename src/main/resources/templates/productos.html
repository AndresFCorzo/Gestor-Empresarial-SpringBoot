<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">🏢 Gestión de Productos</span>
            <div>
                <a href="/dashboard.html" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-house"></i> Inicio</a>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Salir</button>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-box-seam"></i> Lista de Productos</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productoModal" onclick="resetForm()">
                <i class="bi bi-plus-circle"></i> Nuevo Producto
            </button>
        </div>
        
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="productosTable">
                        <thead class="table-dark">
                            <tr><th>ID</th><th>Código</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>IVA</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="productosBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal -->
    <div class="modal fade" id="productoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registrar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productoForm">
                        <input type="hidden" id="productoId">
                        <div class="mb-3"><label>Nombre *</label><input type="text" class="form-control" id="nombre" required></div>
                        <div class="mb-3"><label>Código *</label><input type="text" class="form-control" id="codigo" required></div>
                        <div class="mb-3"><label>Precio *</label><input type="number" step="0.01" class="form-control" id="precio" required></div>
                        <div class="mb-3"><label>Stock</label><input type="number" class="form-control" id="stock" value="0"></div>
                        <div class="mb-3"><label>Categoría</label><input type="text" class="form-control" id="categoria"></div>
                        <div class="mb-3 form-check"><input type="checkbox" class="form-check-input" id="aplicaIva" checked><label class="form-check-label">Aplica IVA</label></div>
                        <div class="mb-3" id="divPorcentajeIva"><label>Porcentaje IVA</label><input type="number" step="0.01" class="form-control" id="porcentajeIva" value="19.0"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarProducto()">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = '/api/productos';
        
        async function cargarProductos() {
            const response = await fetch(API_URL);
            const productos = await response.json();
            const tbody = document.getElementById('productosBody');
            tbody.innerHTML = '';
            productos.forEach(p => {
                tbody.innerHTML += `<tr><td>${p.idProducto}</td><td>${p.codigo}</td><td>${p.nombre}</td><td>$${p.precio.toLocaleString()}</td><td>${p.stock}</td><td>${p.aplicaIva ? p.porcentajeIva+'%' : 'Exento'}</td>
                <td><button class="btn btn-sm btn-warning" onclick="editarProducto(${p.idProducto})"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-danger" onclick="eliminarProducto(${p.idProducto})"><i class="bi bi-trash"></i></button></td></tr>`;
            });
        }
        
        async function guardarProducto() {
            const producto = {
                nombre: document.getElementById('nombre').value,
                codigo: document.getElementById('codigo').value,
                precio: parseFloat(document.getElementById('precio').value),
                stock: parseInt(document.getElementById('stock').value),
                categoria: document.getElementById('categoria').value,
                aplicaIva: document.getElementById('aplicaIva').checked,
                porcentajeIva: parseFloat(document.getElementById('porcentajeIva').value)
            };
            
            const id = document.getElementById('productoId').value;
            let response;
            if (id) response = await fetch(`${API_URL}/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(producto) });
            else response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(producto) });
            
            if (response.ok) { alert(id ? 'Producto actualizado' : 'Producto registrado'); bootstrap.Modal.getInstance(document.getElementById('productoModal')).hide(); cargarProductos(); resetForm(); }
            else alert('Error al guardar');
        }
        
        async function editarProducto(id) {
            const response = await fetch(`${API_URL}/${id}`);
            const p = await response.json();
            document.getElementById('productoId').value = p.idProducto;
            document.getElementById('nombre').value = p.nombre;
            document.getElementById('codigo').value = p.codigo;
            document.getElementById('precio').value = p.precio;
            document.getElementById('stock').value = p.stock;
            document.getElementById('categoria').value = p.categoria;
            document.getElementById('aplicaIva').checked = p.aplicaIva;
            document.getElementById('porcentajeIva').value = p.porcentajeIva;
            document.getElementById('divPorcentajeIva').style.display = p.aplicaIva ? 'block' : 'none';
            new bootstrap.Modal(document.getElementById('productoModal')).show();
        }
        
        async function eliminarProducto(id) { if (confirm('¿Eliminar?')) { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); cargarProductos(); } }
        function resetForm() { document.getElementById('productoForm').reset(); document.getElementById('productoId').value = ''; }
        document.getElementById('aplicaIva').addEventListener('change', (e) => { document.getElementById('divPorcentajeIva').style.display = e.target.checked ? 'block' : 'none'; });
        function logout() { localStorage.removeItem('usuario'); window.location.href = '/login.html'; }
        
        if (!localStorage.getItem('usuario')) window.location.href = '/login.html';
        cargarProductos();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
