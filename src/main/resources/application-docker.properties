# =====================================================
# CONFIGURACIÓN PARA ENTORNO DOCKER
# =====================================================
# Perfil: docker
# Activar con: -Dspring.profiles.active=docker
# =====================================================

# Configuración del servidor
server.port=8080

# Configuración de base de datos (variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:gestor_empresarial}?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Configuración de logs
logging.level.com.gestorempresarial=INFO
logging.file.name=/app/logs/gestor-api.log

# Configuración JWT
jwt.secret=${JWT_SECRET:gestorEmpresarialSecretKey2025}
jwt.expiration=${JWT_EXPIRATION:86400000}