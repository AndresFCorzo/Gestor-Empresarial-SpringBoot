# Configuración para entorno Docker
server.port=8080

# Base de datos - USAR "mysql" como host (NO localhost)
spring.datasource.url=jdbc:mysql://mysql:3306/gestor_empresarial?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
jwt.secret=gestorEmpresarialSecretKey2025
jwt.expiration=86400000